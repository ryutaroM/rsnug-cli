[package]
name = "rsnug"
version = "0.1.0"
edition = "2024"
description = "A secrets manager for use by AI agents"
license = "MIT"
repository = "https://github.com/ryutaroM/rsnug-cli"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
age = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
